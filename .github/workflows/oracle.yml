name: ORACLE automatic market scan
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: oracle-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore signal journal for alert deduplication
        uses: actions/cache@v4
        with:
          path: data/oracle.sqlite3
          key: oracle-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            oracle-db-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run automatic ORACLE scan and Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
          GDELT_ENABLED: "true"
          MAX_QUOTE_AGE_MINUTES: "45"
          DB_PATH: data/oracle.sqlite3
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          python -m oracle.main
      - name: Upload scan journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-journal-${{ github.run_id }}
          path: data/oracle.sqlite3
          if-no-files-found: ignore
          retention-days: 30

name: Stella Rossa - calendario USA (GitHub Actions)
on:
  schedule:
    # UTC; event timestamps are converted by the Python calendar logic.
    # A lightweight check every 10 minutes; full analysis only near events.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-rossa-calendar-main
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DB_PATH: data/oracle.sqlite3
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore calendar and Telegram deduplication state
        uses: actions/cache/restore@v4
        with:
          path: data/oracle.sqlite3
          key: stella-calendar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stella-calendar-v1-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Telegram configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || {
            echo "::error::Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secrets"
            exit 1
          }
      - name: Check official calendar and analyze only active event windows
        run: python -m oracle.main
      - name: Save calendar and Telegram deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/oracle.sqlite3
          key: stella-calendar-v1-${{ github.run_id }}-${{ github.run_attempt }}

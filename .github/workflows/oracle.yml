name: ORACLE automatic market scan
on:
  workflow_dispatch:
    inputs:
      send_telegram_test:
        description: "Invia un messaggio di prova a Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: oracle-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore signal journal for alert deduplication
        uses: actions/cache@v6
        with:
          path: data/oracle.sqlite3
          key: oracle-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            oracle-db-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run regression tests before market scan
        run: python -m unittest discover -s tests -v
      - name: Verify Telegram alert credentials and destination
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram non configurato: aggiungere TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID nei GitHub Actions secrets.")
          base = f"https://api.telegram.org/bot{token}"
          for method, params in (("getMe", {}), ("getChat", {"chat_id": chat_id})):
              response = requests.get(f"{base}/{method}", params=params, timeout=15)
              response.raise_for_status()
              if not response.json().get("ok"):
                  raise SystemExit(f"Telegram {method} validation failed")
          print("Telegram token e destinazione validati.")
          PY
      - name: Send explicit Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "🛰️ ORACLE — TEST TELEGRAM\nCollegamento alert automatici verificato. Questo è un messaggio di prova."},
              timeout=15,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise SystemExit("Telegram did not accept the test message")
          print("Telegram test message accepted by API.")
          PY
      - name: Run automatic ORACLE scan and Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
          GDELT_ENABLED: "true"
          MAX_QUOTE_AGE_MINUTES: "45"
          DB_PATH: data/oracle.sqlite3
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          python -m oracle.main
      - name: Upload scan journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-journal-${{ github.run_id }}
          path: data/oracle.sqlite3
          if-no-files-found: ignore
          retention-days: 30

name: Stella Rossa - test e conferma Telegram
on:
  push:
    branches:
      - codex/stella-rossa-calendar
    paths:
      - .github/workflows/stella-rossa-test-telegram.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests (includes historical release cases)
        run: python -m unittest discover -s tests -v
      - name: Simulate calendar without live Telegram
        run: python -m oracle.main --dry-run
      - name: Send Telegram confirmation only after successful checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              raise SystemExit("Telegram secrets missing; no confirmation sent")
          message = ("🔴 STELLA ROSSA — TEST COMPLETATO\n"
                     "Test automatici e dry-run completati sulla PR #24.\n"
                     "PAPER ONLY — nessun ordine e nessun deploy.\n"
                     "Nota: non è una verifica di un evento economico live.")
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat, "text": message},
              timeout=20,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram rejected the test message")
          print("Telegram accepted the test confirmation")
          PY

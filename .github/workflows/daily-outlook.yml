name: Krasnaya Zvezda daily market outlook
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"
permissions:
  contents: read
concurrency:
  group: krasnaya-zvezda-outlook
  cancel-in-progress: false
jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build and send next-session outlook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
          GDELT_ENABLED: "true"
          MAX_QUOTE_AGE_MINUTES: "45"
          PYTHONUNBUFFERED: "1"
        run: python -m oracle.outlook

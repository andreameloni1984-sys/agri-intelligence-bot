name: Stella Rossa - scorte API del martedì sera
on:
  schedule:
    # UTC. The API survey comes out at 16:30 New York time (21:30 UTC in winter,
    # 20:30 UTC in summer; on Wednesday after some holidays) and the figure reaches
    # the news within about two hours. Runs outside the 4-hour window exit at once.
    - cron: "4,14,24,34,44,54 20-23 * * 2,3"
    - cron: "4,14,24,34,44,54 0-1 * * 3,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-rossa-api
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Separate database: never touches the calendar job's state.
      DB_PATH: data/api.sqlite3
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore deduplication state
        uses: actions/cache/restore@v4
        with:
          path: data/api.sqlite3
          key: stella-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stella-api-v1-
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: API crude stocks vs EIA forecast
        run: python -m oracle.api_inventories
      - name: Save deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/api.sqlite3
          key: stella-api-v1-${{ github.run_id }}-${{ github.run_attempt }}

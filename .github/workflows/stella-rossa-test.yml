name: Stella Rossa - test e replay
on:
  push:
    # Verifica dai server di GitHub prima del merge (solo questo branch).
    branches: [claude/commodities-analysis-bot-chat-cywpjt]
    paths: [".github/workflows/stella-rossa-test.yml", "oracle/**", "tests/**"]
  workflow_dispatch:
    inputs:
      send_telegram_test:
        description: "Invia un messaggio Telegram marcato TEST (richiede i secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STELLA_CONTACT_EMAIL: ${{ vars.STELLA_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests and replay of real releases
        run: python -m unittest discover -s tests -v
      - name: Live official calendar (separate database, no Telegram)
        env:
          DB_PATH: ${{ runner.temp }}/stella-test.sqlite3
        run: python -m oracle.main --dry-run
      - name: Telegram TEST message
        if: github.event_name == 'push' || inputs.send_telegram_test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m oracle.telegram_test
